name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tools
        # Ubuntu's clang-format is older and formats differently,
        # so pin the version that the sources are formatted with.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends just
          pip install clang-format==22.1.8
      - run: just venv
      - run: just format-check
      - run: just lint

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        recipe: [release, pytest, pytest-sanitize]
    name: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # Ubuntu's clang-tidy is older and reports false positives,
        # so pin the version that the sources are checked with.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake pkg-config just \
            libpoppler-glib-dev libcairo2-dev libzip-dev libjpeg-dev libpng-dev
          pip install clang-tidy==22.1.8
      - if: matrix.recipe != 'release'
        run: just venv
      - run: just ${{ matrix.recipe }}
      - name: Install
        if: matrix.recipe == 'release'
        run: |
          DESTDIR="$RUNNER_TEMP/install" cmake --install build/release
          find "$RUNNER_TEMP/install" -type f
